<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>ENFapp</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f6f4;--cd:#fff;--tx:#17262b;--mu:#5b6f72;--pr:#167a6c;--on:#fff;--bd:#d3dfdb;--er:#c9402f;--ok:#1d7f4e;--wn:#fff3d6;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a1c;--cd:#16272a;--tx:#e4efed;--mu:#93aaa9;--pr:#4cc5b1;--on:#06201c;--bd:#27403f;--er:#ff7a67;--ok:#5fd394;--wn:#3a3216;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1a1c;--cd:#16272a;--tx:#e4efed;--mu:#93aaa9;--pr:#4cc5b1;--on:#06201c;--bd:#27403f;--er:#ff7a67;--ok:#5fd394;--wn:#3a3216;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 'Atkinson Hyperlegible',system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:12px 14px 40px}
h1,h2,h3{margin:.2em 0 .5em;line-height:1.2}h1{font-size:1.5rem}h2{font-size:1.25rem}
header{display:flex;justify-content:space-between;align-items:center;max-width:640px;margin:0 auto;padding:10px 14px 0}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 14px;max-width:640px;margin:0 auto}
nav button{flex:none;border:1px solid var(--bd);background:var(--cd);color:var(--tx);border-radius:20px;padding:8px 14px;font:inherit}
nav button.on{background:var(--pr);color:var(--on);border-color:var(--pr);font-weight:700}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:10px 0;display:flex;justify-content:space-between;gap:10px}
.c small,.mu{display:block;color:var(--mu)}.c img{max-width:140px;border-radius:8px;margin-top:6px}
.ac{display:flex;flex-direction:column;gap:6px}
button{font:inherit;cursor:pointer}.ac button{border:1px solid var(--bd);background:none;color:var(--tx);border-radius:8px;padding:6px 10px}
.b{background:var(--pr);color:var(--on);border:0;border-radius:10px;padding:11px 16px;font-weight:700;width:100%}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}.k{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:12px}.k b{font-size:1.2rem;display:block}
.al{background:var(--wn);border:1px solid var(--bd);border-left:5px solid var(--er);border-radius:10px;padding:10px;margin:8px 0}
input,select,textarea{width:100%;font:inherit;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
input[type=checkbox]{width:auto}label{display:block;margin:10px 0 4px;color:var(--mu)}
.m{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-end;justify-content:center;z-index:9}
.m>div{background:var(--cd);width:100%;max-width:640px;max-height:92%;overflow:auto;padding:16px;border-radius:16px 16px 0 0}
canvas{width:100%;height:150px;background:#fff;border:1px dashed var(--mu);border-radius:10px;touch-action:none}
.pg{color:var(--ok)}.dv{color:var(--er)}.row{display:flex;gap:8px}.row>*{flex:1}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--pr);outline-offset:2px}
body.mb nav{position:fixed;bottom:0;left:0;right:0;max-width:none;margin:0;background:var(--cd);border-top:1px solid var(--bd);padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
body.mb nav button{padding:12px 16px}body.mb main{padding-bottom:96px}body.mb .b{padding:14px 16px}
body.dk #app{display:grid;grid-template-columns:230px 1fr;grid-template-areas:"h h" "n m"}
body.dk header{grid-area:h;max-width:none;width:100%;margin:0;padding:14px 24px;border-bottom:1px solid var(--bd)}
body.dk nav{grid-area:n;flex-direction:column;overflow:visible;padding:16px;margin:0;max-width:none}
body.dk nav button{text-align:left;border-radius:10px}
body.dk main{grid-area:m;max-width:960px;margin:0;width:100%;padding:20px 28px 40px}
body.dk #app>main:only-child{grid-area:auto;grid-column:1/3;margin:40px auto;max-width:420px}
body.dk .m{align-items:center}body.dk .m>div{border-radius:16px;max-width:520px}
body.dk .b{width:auto;min-width:160px}body.dk .row>.b{width:100%}

.tl{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px 0}body.dk .tl{grid-template-columns:repeat(5,1fr)}
.t{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:var(--cd);color:var(--tx);border:1px solid var(--bd);border-radius:18px;padding:6px;font:inherit;font-size:.88rem;cursor:pointer;transition:transform .12s,border-color .12s}
.t:hover{border-color:var(--pr)}.t:active{transform:scale(.97)}
svg.i,.t svg,.bar svg,nav svg{fill:none;stroke-linecap:round;stroke-linejoin:round}.t svg{width:30px;height:30px;stroke:var(--pr);stroke-width:1.7}
.bar{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--cd);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:6;justify-content:space-around}
body.mb .bar{display:flex}body.mb nav{display:none}
.bar button{all:unset;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;color:var(--mu);padding:6px 8px;min-width:56px;cursor:pointer}.bar svg{width:22px;height:22px;stroke:currentColor;stroke-width:1.8}.bar .on{color:var(--pr);font-weight:700}
nav svg{width:18px;height:18px;stroke:currentColor;stroke-width:1.8;vertical-align:-4px;margin-right:8px}
.seg{display:flex;border:1px solid var(--bd);border-radius:12px;overflow:hidden}.seg button{flex:1;padding:11px;border:0;background:none;color:var(--tx);font:inherit}.seg .on{background:var(--pr);color:var(--on);font-weight:700}
.sw{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 14px}.sw button,.sw-c{width:40px;height:40px;border-radius:50%;border:3px solid var(--cd);box-shadow:0 0 0 1px var(--bd);padding:0;margin:0;cursor:pointer}.sw .on{box-shadow:0 0 0 3px var(--pr)}
.sw-c{background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red);position:relative;overflow:hidden;display:block}.sw-c input{position:absolute;inset:0;width:100%;height:100%;opacity:0;padding:0;cursor:pointer}
header span button[onclick="vw()"]{display:none}header{padding-top:14px}.c{border-radius:14px;box-shadow:0 1px 2px #0000000d}
.it .hd{position:absolute;width:14px;height:14px;background:#fff;border:2px solid #1473e6;border-radius:3px;display:block;transform:translate(-50%,-50%)}
@media (pointer:coarse){.it .hd{width:26px;height:26px}}
.hd.nw{left:0;top:0;cursor:nwse-resize}.hd.ne{left:100%;top:0;cursor:nesw-resize}.hd.sw{left:0;top:100%;cursor:nesw-resize}.hd.se{left:100%;top:100%;cursor:nwse-resize}
.it .ib{position:absolute;left:-2px;top:-21px;background:#1473e6;color:#fff;font-size:11px;font-weight:400;padding:2px 6px;border-radius:4px 4px 0 0;white-space:nowrap}

.pgw{container-type:inline-size}.it{user-select:none;-webkit-user-select:none}#sc{cursor:grab;user-select:none;-webkit-user-select:none}#sc.pn{cursor:grabbing}
.bar button{flex:1;min-width:0;padding:6px 2px}.bar span{font-size:.68rem}

.av{display:flex;align-items:center;justify-content:center;width:96px;height:96px;border-radius:50%;background:var(--cd);border:2px dashed var(--bd);overflow:hidden;cursor:pointer;margin:0 auto;padding:0}
.av img,.av2 img{width:100%;height:100%;object-fit:cover}
.av2{all:unset;width:32px;height:32px;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;background:var(--cd);border:1px solid var(--bd);cursor:pointer}
</style></head><body><div id="app"></div>
<script>
const $=s=>document.querySelector(s),L=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}},
S=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){alert('Sem espaço para salvar. Use um arquivo menor.')}},
esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),
R=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),D=s=>s?s.split('-').reverse().join('/'):'',
dd=s=>Math.round((new Date(s+'T00:00')-new Date().setHours(0,0,0,0))/864e5),
h=s=>{let x=0;for(const c of s)x=(x*31+c.charCodeAt(0))|0;return x},
ld=()=>{try{return sessionStorage.getItem('enf_s')}catch(e){return window._s}};
let tab='home',mode='login';
const T=['COREN','Identidade (RG)','CPF','CNH','Diploma ou certificado','Comprovante de residência','Outro'];
const C={
docs:{t:'Documentos',f:[['tipo','Tipo','sel',T],['num','Número'],['val','Validade','date'],['arq','Foto ou arquivo','file']],
 l:r=>`<div><b>${esc(r.tipo)}</b> ${esc(r.num)}<small>${r.val?'Validade '+D(r.val):''}</small>${r.arq?(r.arq.startsWith('data:image')?`<img src="${r.arq}" alt="">`:'<small>Arquivo anexado</small>'):''}</div>`},
plantoes:{t:'Plantões',f:[['data','Data','date'],['hc','Homecare','hc'],['pac','Paciente ou local'],['tur','Turno','sel',['Diurno 12h','Noturno 12h','24h','Outro']],['valor','Valor (R$)','number']],
 l:r=>`<div><b>${D(r.data)}</b> · ${esc(r.tur)}<small>${esc(r.hc)} – ${esc(r.pac)}</small><small>${R(r.valor)}</small></div>`},
hc:{t:'Homecare',f:[['nome','Nome da empresa'],['tel','Telefone ou contato'],['valor','Valor padrão do plantão (R$)','number']],
 l:r=>`<div><b>${esc(r.nome)}</b><small>${esc(r.tel)}</small><small>Plantão: ${R(r.valor)}</small></div>`},
receber:{t:'Plantão a receber',f:[['hc','Homecare','hc'],['desc','Descrição (plantões do período)'],['valor','Valor (R$)','number'],['data','Data prevista','date'],['lem','Lembrar no app','chk']],tg:'pago',tgl:'Recebido',
 l:r=>`<div><b>${R(r.valor)}</b> · ${esc(r.hc)}<small>${esc(r.desc)}</small><small class="${r.pago?'pg':''}">${r.pago?'Recebido':'Previsto para '+D(r.data)+(r.lem?' · com lembrete':'')}</small></div>`},
rel:{t:'Relatório',f:[['data','Data','date'],['pac','Paciente'],['hc','Homecare','hc'],['txt','Relato do plantão','area']],
 l:r=>`<div><b>${D(r.data)}</b> · ${esc(r.pac)}<small>${esc(r.hc)}</small><p style="margin:6px 0 0;white-space:pre-wrap">${esc(r.txt)}</p></div>`},
desp:{t:'Despesa',f:[['desc','Descrição'],['cat','Categoria','sel',['Transporte','Alimentação','Uniforme e materiais','Curso','Outros']],['valor','Valor (R$)','number'],['data','Data','date']],
 l:r=>`<div><b>${esc(r.desc)}</b><small>${esc(r.cat)} · ${D(r.data)}</small><small class="dv">${R(r.valor)}</small></div>`},
contas:{t:'Conta a pagar',f:[['desc','Descrição'],['valor','Valor (R$)','number'],['data','Vencimento','date'],['lem','Lembrar no app','chk']],tg:'pago',tgl:'Paga',
 l:r=>`<div><b>${esc(r.desc)}</b> · ${R(r.valor)}<small class="${r.pago?'pg':'dv'}">${r.pago?'Paga':'Vence em '+D(r.data)}</small></div>`}};
const G=k=>L('enf_'+k,[]);
function login(){const u=L('enf_user',null);if(!u)mode='cad';
$('#app').innerHTML=`<main><h1>ENFapp</h1><p class="mu">Seu plantão, seus documentos e seu dinheiro em um só lugar.</p><h2>${mode=='cad'?'Criar conta':'Entrar'}</h2>
${mode=='cad'?'<label>Nome</label><input id="n"><label>COREN</label><input id="co">':''}
<label>E-mail</label><input id="e" type="email"><label>Senha</label><input id="p" type="password">
<p></p><button class="b" onclick="${mode=='cad'?'cad()':'ent()'}">${mode=='cad'?'Criar conta':'Entrar'}</button>
${u?`<p><button class="ac" style="all:unset;color:var(--pr);cursor:pointer" onclick="mode='${mode=='cad'?'login':'cad'}';login()">${mode=='cad'?'Já tenho conta':'Criar nova conta'}</button></p>`:''}
<p class="mu">Os dados ficam salvos só neste aparelho.</p></main>`}
function cad(){const n=$('#n').value.trim(),e=$('#e').value.trim(),p=$('#p').value;if(!n||!e||p.length<4)return alert('Preencha nome, e-mail e uma senha de 4 ou mais caracteres.');
S('enf_user',{n,co:$('#co').value,e,p:h(p)});go()}
function ent(){const u=L('enf_user');if(u.e!=$('#e').value.trim()||u.p!=h($('#p').value))return alert('E-mail ou senha incorretos.');go()}
function go(){try{sessionStorage.setItem('enf_s','1')}catch(e){window._s='1'}render()}
function sair(){try{sessionStorage.removeItem('enf_s')}catch(e){window._s=''}mode='login';login()}
function alerts(){const o=[];[['receber','Receber'],['contas','Pagar']].forEach(([k,n])=>G(k).forEach(r=>{if(!r.pago&&r.lem&&r.data){const d=dd(r.data);if(d<=3)o.push(`${n}: ${esc(r.desc||r.hc)} · ${R(r.valor)} · ${d<0?'atrasado '+(-d)+' dia(s)':d==0?'é hoje':'em '+d+' dia(s)'}`)}}));return o}
function render(){if(!ld())return login();const M=L('enf_mkt',{saldo:0,itens:[]});
const tabs=[['home','Início'],['docs','Documentos'],['fic','Produtividade'],['plantoes','Plantões'],['hc','Homecares'],['receber','A receber'],['rel','Relatórios'],['desp','Despesas'],['fin','Financeiro'],['mkt','Mercado'],['cfg','Configurações']];
let b='';
if(tab=='home'){b=homeV()}else if(tab=='_old'){const al=alerts(),u=L('enf_user'),pr=G('plantoes').filter(p=>p.data&&dd(p.data)>=0).length,rc=G('receber').filter(r=>!r.pago).reduce((s,r)=>s+r.valor,0);
b=`<h1>Olá, ${esc(u.n.split(' ')[0])}</h1>${u.co?`<p class="mu">COREN ${esc(u.co)}</p>`:''}
${al.map(a=>`<div class="al">${a}</div>`).join('')||'<p class="mu">Nenhum lembrete para os próximos 3 dias.</p>'}
${'Notification' in window&&Notification.permission=='default'?'<button class="b" onclick="Notification.requestPermission().then(render)">Ativar notificações do aparelho</button>':''}
<div class="g" style="margin-top:10px"><div class="k"><small>Plantões agendados</small><b>${pr}</b></div><div class="k"><small>A receber</small><b>${R(rc)}</b></div><div class="k"><small>Saldo do mercado</small><b>${R(M.saldo)}</b></div><div class="k"><small>Contas em aberto</small><b>${G('contas').filter(c=>!c.pago).length}</b></div></div>`;
if(!window._n&&al.length&&'Notification' in window&&Notification.permission=='granted'){window._n=1;new Notification('ENFapp',{body:al[0]})}}
else if(tab=='fin'){const rc=G('receber'),ct=G('contas'),sm=(a,f)=>a.filter(f).reduce((s,r)=>s+r.valor,0),rec=sm(rc,r=>r.pago),pen=sm(rc,r=>!r.pago),ds=sm(G('desp'),()=>1),cp=sm(ct,c=>c.pago),cf=sm(ct,c=>!c.pago);
b=`<h1>Financeiro</h1><div class="g"><div class="k"><small>Recebido</small><b class="pg">${R(rec)}</b></div><div class="k"><small>A receber</small><b>${R(pen)}</b></div><div class="k"><small>Despesas</small><b class="dv">${R(ds)}</b></div><div class="k"><small>Contas a pagar</small><b class="dv">${R(cf)}</b></div></div>
<div class="k" style="margin-top:10px"><small>Saldo (recebido − despesas − contas pagas)</small><b>${R(rec-ds-cp)}</b></div><h2 style="margin-top:18px">Contas a pagar</h2>`+list('contas')}
else if(tab=='mkt'){b=`<h1>Mercado</h1><div class="k"><small>Saldo disponível</small><b style="font-size:1.8rem">${R(M.saldo)}</b></div>
<label>Recarregar saldo (R$)</label><div class="row"><input id="rv" type="number" step="0.01"><button class="b" onclick="rec()">Recarregar</button></div>
<h2 style="margin-top:18px">Adicionar produto</h2><div class="row"><input id="pn" placeholder="Produto"><input id="pp" type="number" step="0.01" placeholder="Preço"><input id="pq" type="number" value="1" min="1"></div><p></p><button class="b" onclick="prod()">Adicionar e dar baixa</button>
<h2 style="margin-top:18px">Lista (${M.itens.length})</h2>`+(M.itens.map((i,x)=>`<div class="c"><div><b>${esc(i.n)}</b><small>${i.q} × ${R(i.p)} = ${R(i.p*i.q)}</small></div><div class="ac"><button onclick="rmp(${x})">Remover e estornar</button></div></div>`).join('')||'<p class="mu">Nenhum produto ainda.</p>')+`<p class="mu">Total gasto: ${R(M.itens.reduce((s,i)=>s+i.p*i.q,0))}</p>`}
else if(tab=='fic')b=fic();else if(tab=='cfg')b=cfgV();else if(tab=='plano')b=planoV();else if(tab=='adm')b=admV();else b=`<h1>${C[tab].t}</h1>`+(tab=='docs'?sig():'')+list(tab);
$('#app').innerHTML=`<header>${tab=='home'?'<b>ENFapp</b>':'<button style="all:unset;cursor:pointer;color:var(--pr);font-weight:700" onclick="tab=\'home\';render();scrollTo(0,0)">‹ Início</button>'}<span style="display:flex;align-items:center;gap:12px"><button class="av2" onclick="tab='cfg';render()" aria-label="Perfil">${avc(32)}</button><button style="all:unset;color:var(--mu);cursor:pointer;margin-right:16px" onclick="vw()">${V()=='dk'?'Modo celular':'Modo computador'}</button><button class="ac" style="all:unset;color:var(--pr);cursor:pointer" onclick="sair()">Sair</button></span></header><nav>${tabs.map(([k,n])=>`<button class="${k==tab?'on':''}" onclick="tab='${k}';render()">${ic(k)}${n}</button>`).join('')}</nav><main>${b}</main>${bar()}`;
if(tab=='docs')initSig();if(tab=='fic'&&F)pgv()}
function list(k){const c=C[k],a=G(k);return `<button class="b" onclick="add('${k}')">+ Cadastrar</button>`+(a.map((r,i)=>`<div class="c">${c.l(r)}<div class="ac">${c.tg?`<button onclick="tg('${k}',${i})">${r[c.tg]?'Reabrir':'Marcar '+c.tgl.toLowerCase()}</button>`:''}<button onclick="del('${k}',${i})">Excluir</button></div></div>`).join('')||'<p class="mu">Nada cadastrado ainda. Toque em Cadastrar.</p>')}
function add(k){let x=`<h2>${C[k].t}</h2>`;C[k].f.forEach(([n,l,t,o])=>{x+=(t=='chk'?`<label><input type="checkbox" id="f_${n}"> ${l}</label>`:`<label>${l}</label>`+(t=='sel'?`<select id="f_${n}">${o.map(v=>`<option>${v}</option>`).join('')}</select>`:t=='hc'?`<select id="f_${n}">${G('hc').map(v=>`<option>${esc(v.nome)}</option>`).join('')||'<option value="">Sem homecare cadastrado</option>'}</select>`:t=='area'?`<textarea id="f_${n}" rows="6"></textarea>`:`<input id="f_${n}" type="${t=='file'?'file':t||'text'}" ${t=='number'?'step="0.01"':''} ${t=='file'?'accept="image/*,application/pdf"':''}>`))});
x+=`<p></p><div class="row"><button class="b" onclick="save('${k}')">Salvar</button><button class="b" style="background:var(--bd);color:var(--tx)" onclick="cm()">Cancelar</button></div>`;
const m=document.createElement('div');m.className='m';m.id='mm';m.innerHTML=`<div>${x}</div>`;document.body.appendChild(m)}
const cm=()=>$('#mm')?.remove(),rd=f=>new Promise(r=>{const x=new FileReader;x.onload=()=>r(x.result);x.readAsDataURL(f)});
async function save(k){const r={};for(const [n,,t] of C[k].f){const e=$('#f_'+n);r[n]=t=='file'?(e.files[0]?await rd(e.files[0]):''):t=='chk'?e.checked:t=='number'?parseFloat(e.value)||0:e.value}
const a=G(k);a.unshift(r);S('enf_'+k,a);cm();render()}
function del(k,i){if(!confirm('Excluir este item?'))return;const a=G(k);a.splice(i,1);S('enf_'+k,a);render()}
function tg(k,i){const a=G(k);a[i].pago=!a[i].pago;S('enf_'+k,a);render()}
function rec(){const v=parseFloat($('#rv').value);if(!(v>0))return alert('Informe um valor maior que zero.');const M=L('enf_mkt',{saldo:0,itens:[]});M.saldo+=v;S('enf_mkt',M);render()}
function prod(){const n=$('#pn').value.trim(),p=parseFloat($('#pp').value),q=parseInt($('#pq').value)||1;if(!n||!(p>=0))return alert('Informe produto e preço.');

/* ENFapp Push Notifications — Web Push via Supabase */
function pushVapidBytes(value){
  const pad='='.repeat((4-value.length%4)%4);
  const raw=atob((value+pad).replace(/-/g,'+').replace(/_/g,'/'));
  return Uint8Array.from(raw,c=>c.charCodeAt(0));
}
async function pushSubscribe(){
  try{
    const c=SB();
    if(!c.tok)return alert('Entre na sua conta para ativar as notificações.');
    if(!('serviceWorker' in navigator)||!('PushManager' in window)||!('Notification' in window))
      return alert('Este navegador não oferece suporte a notificações push. Atualize o navegador ou instale o ENFapp como aplicativo.');
    if(!isSecureContext)return alert('As notificações exigem uma conexão HTTPS.');
    let permission=Notification.permission;
    if(permission==='default')permission=await Notification.requestPermission();
    if(permission!=='granted')return alert('Permissão não concedida. Autorize as notificações nas configurações do navegador.');
    const reg=await navigator.serviceWorker.register('/sw.js',{scope:'/'});
    await navigator.serviceWorker.ready;
    const kr=await sbq('/functions/v1/push?action=key',{method:'POST',body:'{}'});
    const kj=await kr.json().catch(()=>({}));
    if(!kr.ok||!kj.key)throw new Error(kj.error||'Não foi possível obter a chave pública de notificações.');
    let sub=await reg.pushManager.getSubscription();
    if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:pushVapidBytes(kj.key)});
    const data=sub.toJSON();
    if(!data.endpoint||!data.keys?.p256dh||!data.keys?.auth)throw new Error('O navegador não retornou os dados da inscrição push.');
    const saved=await sbq('/rest/v1/rpc/claim_push',{method:'POST',body:JSON.stringify({
      p_endpoint:data.endpoint,p_p256dh:data.keys.p256dh,p_auth:data.keys.auth,
      p_tz:Intl.DateTimeFormat().resolvedOptions().timeZone||'America/Sao_Paulo'
    })});
    if(!saved.ok)throw new Error(await saved.text());
    alert('Notificações ativadas neste dispositivo! Agora você poderá receber alertas do ENFapp.');
  }catch(e){sbe(e)}
}
async function pushTest(){
  try{
    if(!SB().tok)return alert('Entre na sua conta para testar as notificações.');
    const reg=await navigator.serviceWorker.getRegistration('/');
    const sub=reg&&await reg.pushManager.getSubscription();
    if(!sub)return alert('Este dispositivo ainda não está inscrito. Primeiro toque em Ativar notificações.');
    const q=await sbq('/functions/v1/push?action=test',{method:'POST',body:'{}'});
    const j=await q.json().catch(()=>({}));
    if(!q.ok)throw new Error(j.error||'Falha ao enviar a notificação de teste.');
    if(!j.enviadas)return alert('Não foi possível entregar a notificação. Confira a inscrição deste dispositivo e tente ativar novamente.');
    alert('Notificação de teste enviada! Confira a central de notificações do aparelho.');
  }catch(e){sbe(e)}
}
