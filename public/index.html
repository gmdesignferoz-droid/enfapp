<script>

hc:{t:'Homecare',f:[['nome','Nome da empresa'],['tel','Telefone ou contato'],['valor','Valor padrão do plantão (R$)','number']],

 l:r=>`<div><b>${esc(r.desc)}</b><small>${esc(r.cat)} · ${D(r.data)}</small><small class="dv">${R(r.valor)}</small></div>`},

 l:r=>`<div><b>${esc(r.desc)}</b> · ${R(r.valor)}<small class="${r.pago?'pg':'dv'}">${r.pago?'Paga':'Vence em '+D(r.data)}</small></div>`}};
const G=k=>L('enf_'+k,[]);
function login(){const u=L('enf_user',null);if(!u)mode='cad';
$('#app').innerHTML=`<main><h1>ENFapp</h1><p class="mu">Seu plantão, seus documentos e seu dinheiro em um só lugar.</p><h2>${mode=='cad'?'Criar conta':'Entrar'}</h2>
${mode=='cad'?'<label>Nome</label><input id="n"><label>COREN</label><input id="co">':''}
<label>E-mail</label><input id="e" type="email"><label>Senha</label><input id="p" type="password">
<p></p><button class="b" onclick="${mode=='cad'?'cad()':'ent()'}">${mode=='cad'?'Criar conta':'Entrar'}</button>
${u?`<p><button class="ac" style="all:unset;color:var(--pr);cursor:pointer" onclick="mode='${mode=='cad'?'login':'cad'}';login()">${mode=='cad'?'Já tenho conta':'Criar nova conta'}</button></p>`:''}
<p class="mu">Os dados ficam salvos só neste aparelho.</p></main>`}
function cad(){const n=$('#n').value.trim(),e=$('#e').value.trim(),p=$('#p').value;if(!n||!e||p.length<4)return alert('Preencha nome, e-mail e uma senha de 4 ou mais caracteres.');
S('enf_user',{n,co:$('#co').value,e,p:h(p)});go()}
function ent(){const u=L('enf_user');if(u.e!=$('#e').value.trim()||u.p!=h($('#p').value))return alert('E-mail ou senha incorretos.');go()}
function go(){try{sessionStorage.setItem('enf_s','1')}catch(e){window._s='1'}render()}

const tabs=[['home','Início'],['docs','Documentos'],['fic','Produtividade'],['plantoes','Plantões'],['med','Medicamentos'],['hc','Homecares'],['rel','Relatórios'],['desp','Despesas'],['fin','Financeiro'],['mkt','Mercado'],['cfg','Configurações']];
let b='';
if(tab=='home'){b=homeV()}else if(tab=='_old'){const al=alerts(),u=L('enf_user'),pr=G('plantoes').filter(p=>p.data&&dd(p.data)>=0).length,rc=G('receber').filter(r=>!r.pago).reduce((s,r)=>s+r.valor,0);
b=`<h1>Olá, ${esc(u.n.split(' ')[0])}</h1>${u.co?`<p class="mu">COREN ${esc(u.co)}</p>`:''}
${al.map(a=>`<div class="al">${a}</div>`).join('')||'<p class="mu">Nenhum lembrete para os próximos 3 dias.</p>'}
${'Notification' in window&&Notification.permission=='default'?'<button class="b" onclick="Notification.requestPermission().then(render)">Ativar notificações do aparelho</button>':''}
<div class="g" style="margin-top:10px"><div class="k"><small>Plantões agendados</small><b>${pr}</b></div><div class="k"><small>A receber</small><b>${R(rc)}</b></div><div class="k"><small>Saldo do mercado</small><b>${R(M.saldo)}</b></div><div class="k"><small>Contas em aberto</small><b>${G('contas').filter(c=>!c.pago).length}</b></div></div>`;
if(!window._n&&al.length&&'Notification' in window&&Notification.permission=='granted'){window._n=1;new Notification('ENFapp',{body:al[0]})}}
else if(tab=='med')b=medV();else if(tab=='mkt')b=mktV();else if(tab=='fin'){const rc=G('plantoes').filter(x=>['Realizado','Aguardando pagamento','Recebido'].includes(x.status)).map(x=>({valor:+x.valor||0,pago:x.status=='Recebido'})),ct=G('contas'),sm=(a,f)=>a.filter(f).reduce((s,r)=>s+r.valor,0),rec=sm(rc,r=>r.pago),pen=sm(rc,r=>!r.pago),ds=sm(G('desp'),()=>1),cp=sm(ct,c=>c.pago),cf=sm(ct,c=>!c.pago);
b=`<h1>Financeiro</h1><div class="g"><div class="k"><small>Recebido</small><b class="pg">${R(rec)}</b></div><div class="k"><small>A receber</small><b>${R(pen)}</b></div><div class="k"><small>Despesas</small><b class="dv">${R(ds)}</b></div><div class="k"><small>Contas a pagar</small><b class="dv">${R(cf)}</b></div></div>
<div class="k" style="margin-top:10px"><small>Saldo (recebido − despesas − contas pagas)</small><b>${R(rec-ds-cp)}</b></div><h2 style="margin-top:18px">Contas a pagar</h2>`+list('contas')}
else if(tab=='mkt'){b=`<h1>Mercado</h1><div class="k"><small>Saldo disponível</small><b style="font-size:1.8rem">${R(M.saldo)}</b></div>
<label>Recarregar saldo (R$)</label><div class="row"><input id="rv" type="number" step="0.01"><button class="b" onclick="rec()">Recarregar</button></div>
<h2 style="margin-top:18px">Adicionar produto</h2><div class="row" style="margin-bottom:10px"><button class="b ghost" onclick="aud()">Falar produto</button><button class="b ghost" onclick="scan()">Ler código de barras</button></div><div class="row"><input id="pn" placeholder="Produto"><input id="pp" type="number" step="0.01" placeholder="Preço"><input id="pq" type="number" value="1" min="1"></div><p></p><button class="b" onclick="prod()">Adicionar e dar baixa</button>
<h2 style="margin-top:18px">Lista (${M.itens.length})</h2>`+(M.itens.map((i,x)=>`<div class="c"><div><b>${esc(i.n)}</b><small>${i.q} × ${R(i.p)} = ${R(i.p*i.q)}</small></div><div class="ac"><button onclick="rmp(${x})">Remover e estornar</button></div></div>`).join('')||'<p class="mu">Nenhum produto ainda.</p>')+`<p class="mu">Total gasto: ${R(M.itens.reduce((s,i)=>s+i.p*i.q,0))}</p>`}
else if(tab=='plantoes')b=plantV();else if(tab=='fic')b=fic();else if(tab=='cfg')b=cfgV();else if(tab=='plano')b=planoV();else if(tab=='adm')b=admV();else b=`<h1>${C[tab].t}</h1>`+(tab=='docs'?sig():'')+list(tab);

function add(k){let x=`<h2>${C[k].t}</h2>`;C[k].f.forEach(([n,l,t,o])=>{x+=(t=='chk'?`<label><input type="checkbox" id="f_${n}"> ${l}</label>`:`<label>${l}</label>`+(t=='sel'?`<select id="f_${n}">${o.map(v=>`<option>${v}</option>`).join('')}</select>`:t=='hc'?`<select id="f_${n}">${G('hc').map(v=>`<option>${esc(v.nome)}</option>`).join('')||'<option value="">Sem homecare cadastrado</option>'}</select>`:t=='area'?`<textarea id="f_${n}" rows="6"></textarea>`:`<input id="f_${n}" type="${t=='file'?'file':t||'text'}" ${t=='number'?'step="0.01"':''} ${t=='file'?'accept="image/*,application/pdf"':''}>`))});

const cm=()=>$('#mm')?.remove(),rd=f=>new Promise(r=>{const x=new FileReader;x.onload=()=>r(x.result);x.readAsDataURL(f)});
